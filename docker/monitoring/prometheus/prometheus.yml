global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: backend
    metrics_path: /api/metrics
    static_configs:
      - targets: ['host.docker.internal:3000']

  - job_name: node_exporter
    static_configs:
      - targets: ['node_exporter:9100']
