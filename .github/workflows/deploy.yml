name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Validate lockfile
        run: pnpm install --frozen-lockfile

      - name: Deploy step placeholder (phase-5 scaffold)
        run: |
          echo "Deploy pipeline scaffold is ready."
          echo "Production deployment commands will be enabled after backend build pipeline is finalized."
          echo "Target script: scripts/deploy.sh"
